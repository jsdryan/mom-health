name: 新增體重

on:
  workflow_dispatch:
    inputs:
      kg:
        description: 體重（公斤）
        required: true
      date:
        description: 日期 yyyy-MM-dd，留空用今天
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-json
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 寫入 data.json
        env:
          KG: ${{ inputs.kg }}
          DATE: ${{ inputs.date }}
        run: python3 scripts/add_weight.py

      - name: Commit
        run: |
          if git diff --quiet data.json; then
            echo "體重沒有變化，不用更新"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "體重 ${{ inputs.date || 'today' }}: ${{ inputs.kg }} kg"
          git push
